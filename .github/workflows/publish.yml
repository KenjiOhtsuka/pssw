name: Publish PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version to publish (for example, 0.1.0)'
        required: true
        type: string
      tag:
        description: 'Existing Git tag to publish (for example, v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release inputs and manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -ne "v$($env:RELEASE_VERSION)") {
            throw "Tag must be v<version>; received '$($env:RELEASE_TAG)' for version '$($env:RELEASE_VERSION)'."
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use major.minor.patch format: $($env:RELEASE_VERSION)"
          }
          $manifest = Test-ModuleManifest ./PSSW.psd1
          if ($manifest.Version -ne [version]$env:RELEASE_VERSION) {
            throw "Manifest version $($manifest.Version) does not match requested version $($env:RELEASE_VERSION)."
          }
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'The PSGALLERY_API_KEY secret is required.'
          }

      - name: Publish module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Publish-Module -Path . -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY
